<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- README banner and GitHub social preview, 1280 x 640. Rendered by scripts/readme-media.mjs from the
     sheets it has just printed. ?theme=dark gives the dark version. -->
<style>
  @font-face { font-family: Geist; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Noto Sans Arabic"; src: url("fonts/noto-sans-arabic-arabic-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: JBM; src: url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  :root { --bg: #f5f5f4; --ink: #141414; --mute: #5c5c5c; --line: #d6d6d4; --card: #ffffff; --accent: #F26A1B; }
  :root[data-theme="dark"] { --bg: #0b0b0b; --ink: #f4f4f4; --mute: #a6a6a6; --line: #2b2b2b; --card: #141414; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Geist, sans-serif; }
  body { position: relative; }
  .rule { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 32px; opacity: .5; mask-image: linear-gradient(90deg, #000 0 32%, transparent 58%); }
  .left { position: absolute; left: 64px; top: 64px; width: 600px; }
  .brand { display: flex; align-items: baseline; gap: 14px; font: 700 26px Geist, sans-serif; letter-spacing: -.02em; }
  .brand i { font-style: normal; color: var(--accent); }
  .brand .ar { font: 600 22px "Noto Sans Arabic", "Geeza Pro", sans-serif; color: var(--mute); }
  .tag { margin-left: 4px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font: 500 12px JBM, monospace; letter-spacing: .14em; color: var(--mute); align-self: center; }
  h1 { margin-top: 52px; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: var(--accent); }
  p { margin-top: 24px; font-size: 21px; line-height: 1.42; color: var(--mute); max-width: 30ch; }
  .chips { position: absolute; left: 64px; bottom: 60px; display: flex; gap: 8px; flex-wrap: wrap; width: 560px; }
  .chips span { font: 500 12.5px JBM, monospace; letter-spacing: .08em; padding: 7px 11px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; }
  .chips span.on { background: var(--accent); border-color: var(--accent); color: #141414; }
  .sheet { position: absolute; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 30px 60px -22px rgba(0,0,0,.38), 0 10px 22px -12px rgba(0,0,0,.25); border: 1px solid rgba(0,0,0,.08); }
  .sheet img { display: block; width: 100%; }
  .sheet b { position: absolute; left: 10px; bottom: 10px; font: 500 11px JBM, monospace; letter-spacing: .1em; padding: 5px 8px; border-radius: 6px; background: rgba(20,20,20,.82); color: #f4f4f4; }
  .s1 { left: 690px; top: 70px;  width: 270px; transform: rotate(-4deg); z-index: 1; }
  .s2 { left: 945px; top: 38px;  width: 270px; transform: rotate(3deg);  z-index: 2; }
  .s3 { left: 815px; top: 196px; width: 282px; transform: rotate(-1deg); z-index: 3; }
</style></head>
<body>
<div class="rule"></div>
<div class="left">
  <div class="brand"><span>hesabak<i>.</i></span><span class="ar" lang="ar" dir="rtl">حسابك</span><span class="tag">INVOICES · RECEIPTS</span></div>
  <h1>Bill like a studio. <em>Keep it all</em> on your machine.</h1>
  <p>Profiles, four templates, receipts with payment history. Free, offline, no account.</p>
</div>
<div class="chips"><span class="on">NO SERVER</span><span>WORKS OFFLINE</span><span>A4 PDF</span><span>EGP · USD · EUR · AED</span><span>VAT 14%</span><span>MIT</span></div>
<div class="sheet s1"><img src="sheet-studio.png" alt=""><b>STUDIO</b></div>
<div class="sheet s2"><img src="sheet-bold.png" alt=""><b>BOLD</b></div>
<div class="sheet s3"><img src="sheet-standard-receipt.png" alt=""><b>STANDARD · RECEIPT</b></div>
<script>if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.dataset.theme = "dark";</script>
</body></html>
